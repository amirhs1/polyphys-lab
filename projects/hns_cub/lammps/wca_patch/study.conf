# --- Resources ----------------------------------------------------------
# One row per size class, by the number of particles as the runs counted
# them: crowders plus DNA monomers, without the atoms of the H-NS
# proteins. The first row whose max_particles is not below a run's count
# applies. Memory is per core. The domain grid follows from the cores:
# the inputs set none, and LAMMPS chose 1 by 2 by 2 on 4 cores.
RESOURCES=(
    # max_particles cores mem_per_cpu time
    "5000           4     3G          4-00:00"
    "15000          4     3G          3-00:00"
)
# Runs without crowders, and minimize.lmp: one core each.
NOCROWD_RESOURCES="1 3000M 0-10:00"
MINIMIZE_RESOURCES="1 3000M 0-00:20"
