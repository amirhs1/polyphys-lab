# shellcheck shell=bash
# shellcheck disable=SC2034  # read by the pipeline stages that source it
# HnsCub, variant wca_patch: the values the pipeline stages read for the
# runs of this folder. Sourced by bash; every table is an array of
# whitespace-separated rows.

STUDY="hns_cub"
VARIANT="wca_patch"
# The start configuration, in ../start/; every run folder gets a copy, and
# minimize.lmp, the relaxation that each run runs first, reads it.
START_DATA="dna.data"
# The H-NS molecule, in ../start/; every run folder gets a copy, which
# production.lmp reads.
MOLECULE_DATA="hns.mol"

# --- Software -----------------------------------------------------------
# The LAMMPS version the logs report, written without spaces (the logs
# print "29 Sep 2021"), and the modules the submit scripts load.
LAMMPS_VERSION="29Sep2021"
MODULES="StdEnv/2020 intel/2020.1.217 openmpi/4.0.3 lammps-omp/20210929"

# --- Sweep --------------------------------------------------------------
# One row per state point and set of replicates that ran with the same
# settings; each row runs once per replicate in its ens range. The sweep
# generator writes a row's values at the top of each input, as LAMMPS
# variables of the same names, except ens, written as i, and
# seed_group + ens, written as randseed.
#   N                  number of DNA monomers
#   kBend11            bending rigidity of the DNA
#   n_hns              number of H-NS proteins
#   sig4               size of the crowders; their mass is sig4^3
#   eps34              strength of the H-NS core and crowder pair
#   n_crowd            number of crowders
#   l                  half the side of the cube
#   ens                the row's replicates, first-last
#   seed_group         the run's seed is seed_group + ens
#   neigh_style        neighbor lists of production: bin or multi
