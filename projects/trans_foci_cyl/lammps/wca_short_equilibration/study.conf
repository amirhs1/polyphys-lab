# shellcheck shell=bash
# shellcheck disable=SC2034  # read by the pipeline stages that source it
# TransFociCyl, variant wca_short_equilibration: the values the pipeline
# stages read for the runs of this folder. Sourced by bash; every table is
# an array of whitespace-separated rows.

STUDY="trans_foci_cyl"
VARIANT="wca_short_equilibration"
# The start configuration, in ../start/; every run folder gets a copy.
START_DATA="foci-ring-ns400nl5.data"

# --- Software -----------------------------------------------------------
# The LAMMPS version the logs report, written without spaces (the logs
# print "29 Sep 2021"), and the modules the submit scripts load.
LAMMPS_VERSION="29Sep2021"
MODULES="StdEnv/2020 intel/2020.1.217 openmpi/4.0.3 lammps-omp/20210929"

# --- Sweep --------------------------------------------------------------
# One row per state point and set of replicates that ran with the same
# settings; each row runs once per replicate in its ens range. The sweep
# generator writes a row's values at the top of each input, as LAMMPS
# variables of the same names, except m_big, written as mass2; ens, as i;
# and seed_group + ens, as randseed.
#   sig2 n_big m_big   size, number, and mass of the large monomers
#   n_small            number of small monomers (size and mass 1)
#   epsilon_small      strength of the wall for the small monomers
#   epsilon_big        strength of the wall for the large monomers
#   r lz               radius and half-length of the cylinder
#   sig3 n_crowd       size and number of crowders (mass 1)
#   seed_group         the run's seed is seed_group + ens
#   run_dt             production timestep
#   bug_dump all_dump  dump periods of the chain and of all particles
#   ens                the row's replicates, first-last
#   grid_x grid_y      domains across the cylinder in production; any
#                      number along its axis
SWEEP=(
    # sig2 n_big m_big n_small epsilon_small epsilon_big r lz sig3 n_crowd seed_group run_dt bug_dump all_dump ens grid_x grid_y
    "5 5 125 400 5 5 10.5 77 1 0     14000 0.005 2000 5000 1-8 1 1"
    "5 5 125 400 5 5 10.5 77 1 2310  14120 0.005 2000 5000 1-8 1 1"
    "5 5 125 400 5 5 10.5 77 1 4620  14130 0.005 2000 5000 1-8 1 1"
    "5 5 125 400 5 5 10.5 77 1 6930  14140 0.005 2000 5000 1-8 1 1"
    "5 5 125 400 5 5 10.5 77 1 9240  14010 0.005 2000 5000 1-8 1 1"
    "5 5 125 400 5 5 10.5 77 1 11550 14150 0.005 2000 5000 1-8 1 1"
    "5 5 125 400 5 5 10.5 77 1 13680 14020 0.005 2000 5000 1-8 1 1"
    "5 5 125 400 5 5 10.5 77 1 16170 14160 0.005 2000 5000 1-8 1 1"
    "5 5 125 400 5 5 10.5 77 1 18480 14030 0.005 2000 5000 1-8 1 1"
    "5 5 125 400 5 5 10.5 77 1 20790 14040 0.005 2000 5000 1-8 1 1"
    "5 5 125 400 5 5 10.5 77 1 23100 14050 0.005 2000 5000 1-8 1 1"
    "5 5 125 400 5 5 10.5 77 1 25410 14060 0.005 2000 5000 1-8 2 2"
    "5 5 125 400 5 5 10.5 77 1 27720 14070 0.005 2000 5000 1-8 2 2"
    "5 5 125 400 5 5 10.5 77 1 30030 14080 0.005 2000 5000 1-8 2 2"
    "5 5 125 400 5 5 10.5 77 1 32340 14090 0.005 2000 5000 1-8 2 2"
    "5 5 125 400 5 5 10.5 77 1 34650 14100 0.005 2000 5000 1-8 2 2"
    "5 5 125 400 5 5 10.5 77 1 36960 14110 0.005 2000 5000 1-8 2 2"
)

# --- Resources ----------------------------------------------------------
# One row per size class, by the number of particles (crowders plus
# monomers); the first row whose max_particles is not below a run's
# count applies. Memory is per core.
RESOURCES=(
    # max_particles cores mem_per_cpu time
    "5000           4     3G          2-00:00"
    "15000          4     3G          3-00:00"
    "30000          8     3G          2-00:00"
    "75000          16    3G          1-10:00"
    "200000         32    3G          3-10:00"
)
# Runs without crowders, and minimize.lmp: one core each.
NOCROWD_RESOURCES="1 3000M 0-15:00"
MINIMIZE_RESOURCES="1 3000M 0-01:00"
