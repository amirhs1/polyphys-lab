# shellcheck shell=bash
# shellcheck disable=SC2034  # read by the pipeline stages that source it
# TransFociCub, variant wca: the values the pipeline stages read for
# the runs of this folder. Sourced by bash; every table is an array of
# whitespace-separated rows.

STUDY="trans_foci_cub"
VARIANT="wca"
# The start configuration, in ../start/; every run folder gets a copy.
START_DATA="foci-ring-ns400nl5.data"

# --- Software -----------------------------------------------------------
# The LAMMPS version the logs report, written without spaces (the logs
# print "29 Sep 2021"), and the modules the submit scripts load.
LAMMPS_VERSION="29Sep2021"
MODULES="StdEnv/2020 intel/2020.1.217 openmpi/4.0.3 lammps-omp/20210929"

# --- Sweep --------------------------------------------------------------
# One row per state point and set of replicates that ran with the same
# settings; each row runs once per replicate in its ens range. The sweep
# generator writes a row's values at the top of each input, as LAMMPS
# variables of the same names, except m_big, written as mass2; ens, as i;
# and seed_group + ens, as randseed.
#   sig2 n_big m_big   size, number, and mass of the large monomers
#   n_small            number of small monomers (size and mass 1)
#   l                  half the cube's edge
#   sig3 n_crowd       size and number of crowders (mass 1)
#   seed_group         the run's seed is seed_group + ens
#   run_dt             production timestep
#   bug_dump all_dump  dump periods of the chain and of all particles
#   ens                the row's replicates, first-last
#   neigh_style        neighbor lists of production: bin or multi
#   neigh_skin         neighbor skin of production
#   relax_steps        steps of the harmonic relaxation in minimize.lmp
SWEEP=(
    # sig2 n_big m_big n_small l sig3 n_crowd seed_group run_dt bug_dump all_dump ens neigh_style neigh_skin relax_steps
