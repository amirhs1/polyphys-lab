[build-system]
    requires = ["setuptools>=77.0.3"]
    build-backend = "setuptools.build_meta"

[project]
    name = "polyphys-lab"
    version = "0.0.0"
    description = "Study records and the cluster pipeline for PolyPhys."
    readme = "README.md"
    license = "MIT"
    requires-python = ">=3.11"
    # The lab pins one released PolyPhys; raise the pin deliberately.
    dependencies = [
        "polyphys[mda,viz]==1.0.0"
    ]
    classifiers = [
        "Private :: Do Not Upload"
    ]

[project.optional-dependencies]
    dev = [
        "pytest",
        "hypothesis",
        "flake8",
        "mypy",
        "pandas-stubs",
        "scipy-stubs"
    ]

# Each study's python/ folder is one subpackage of polyphys_lab. Adding a
# study means adding one line to `packages` and one to `package-dir`:
#
#     packages = ["polyphys_lab", "polyphys_lab.<study>"]
#     "polyphys_lab.<study>" = "projects/<study>/python"
[tool.setuptools]
    packages = [
        "polyphys_lab",
        "polyphys_lab.trans_foci_cyl",
        "polyphys_lab.trans_foci_cub",
        "polyphys_lab.hns_cub",
    ]

[tool.setuptools.package-dir]
    "polyphys_lab" = "polyphys_lab"
    "polyphys_lab.trans_foci_cyl" = "projects/trans_foci_cyl/python"
    "polyphys_lab.trans_foci_cub" = "projects/trans_foci_cub/python"
    "polyphys_lab.hns_cub" = "projects/hns_cub/python"

[tool.pytest.ini_options]
    addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
    testpaths = ["tests", "projects"]

# Run mypy through tools/typecheck.py, which maps each study's python/
# folder to its package name.
[tool.mypy]
    strict = true

[[tool.mypy.overrides]]
    # polyphys 1.0.0 ships no py.typed marker, so mypy skips it by default;
    # its sources are fully annotated, so analyze them anyway.
    module = ["polyphys", "polyphys.*"]
    follow_untyped_imports = true

[[tool.mypy.overrides]]
    # MDAnalysis ships no py.typed marker and no stubs, so its names are Any.
    module = ["MDAnalysis", "MDAnalysis.*"]
    ignore_missing_imports = true
